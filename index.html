<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070d1c">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مدير المحتوى">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<title>مدير محتوى روكيت ليق</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: confident studio dashboard for a gaming creator, energetic but tidy.
IDEA: a match-day production board: boost-orange actions on an arena-night navy field.
PICTURE: the "idea of the day" hero with an illustrated rocket car striking the ball.
COLOUR and TYPE: navy #0a1224 ground, boost orange #ff7a1a lead, blue #2f8cff support; Alexandria titles, IBM Plex Sans Arabic body.
LAYOUT: sidebar + content on desktop; top title + bottom tab bar on phones, cards stack.
*/
:root{color-scheme:dark;--bg:#070d1c;--bg2:#0b1530;--card:#0f1b38;--card2:#132247;--line:#1f3263;--ink:#eef3ff;--mute:#93a3c7;--or:#ff7a1a;--or2:#ff9a3c;--bl:#2f8cff;--ok:#20c997;--bad:#ff4d6d}
*{box-sizing:border-box;min-width:0}
html{scroll-padding-top:72px}
body{margin:0;background:radial-gradient(1200px 600px at 85% -10%,#173a8a33,transparent 60%),radial-gradient(900px 500px at 0% 100%,#ff7a1a14,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.6 'IBM Plex Sans Arabic',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:'Alexandria','IBM Plex Sans Arabic',sans-serif;line-height:1.2;margin:0;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.i{width:20px;height:20px;flex:none}
:focus-visible{outline:3px solid var(--or2);outline-offset:2px}
#app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;min-height:100dvh}
/* sidebar */
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0c1735,#070d1c);border-inline-start:1px solid var(--line);padding:18px 14px}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}.brand b{display:block;font-family:Alexandria;font-size:18px}.brand span{color:var(--or);font-family:Alexandria;font-weight:700}
.logo{width:44px;height:44px;flex:none}
.side nav{display:grid;gap:4px}
.nv{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--mute);text-decoration:none;font-weight:600;transition:.2s;position:relative}
.nv:hover{background:#ffffff08;color:var(--ink)}
.nv.on{background:linear-gradient(90deg,#ff7a1a00,#ff7a1a26);color:var(--ink)}.nv.on::before{content:'';position:absolute;inset-inline-start:0;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--or)}
.nv.on .i{color:var(--or)}
.nv b{margin-inline-start:auto;background:var(--or);color:#1a0b00;font-size:12px;border-radius:20px;padding:0 8px;min-width:22px;text-align:center}
.sidefoot{margin-top:auto;display:grid;gap:10px;padding:10px 8px}
.ch{display:flex;align-items:center;gap:8px;font-weight:700}.ch .i{color:#ff3b3b}
.sync{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}.sync i{width:8px;height:8px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}.sync.busy i{background:var(--or);animation:pulse 1s infinite}.sync.err i{background:var(--bad)}
@keyframes pulse{50%{opacity:.3}}
.main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1240px;width:100%}
.mtop{display:none}
.view{animation:vin .35s ease}@keyframes vin{from{opacity:0;transform:translateY(8px)}}
/* header */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.vh h1{font-size:clamp(26px,3.4vw,36px)}.vh p{margin:6px 0 0;color:var(--mute)}.or{color:var(--or)}
.vha{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:#ffffff08;font-weight:700;transition:transform .15s,filter .2s,background .2s;white-space:nowrap}
.btn:hover{background:#ffffff12}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,var(--or2),var(--or));border-color:transparent;color:#1d0c00;box-shadow:0 6px 18px #ff7a1a40}.btn.pri:hover{filter:brightness(1.08)}
.btn.ai{background:linear-gradient(135deg,#2f8cff,#7b5cff);border-color:transparent;color:#fff}
.btn.danger{background:var(--bad);border-color:transparent;color:#fff}.btn.danger.ghost{background:transparent;color:#ff8aa0;border-color:#ff4d6d55}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:#ffffff06;flex:none}.ibtn:hover{border-color:var(--or)}.ibtn .i{width:18px;height:18px}
/* week strip */
.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:18px}
.ws{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;gap:2px;position:relative;overflow:hidden}
.ws small{color:var(--mute);font-size:12.5px}.ws b{font-family:Alexandria;font-size:20px}.ws span{font-size:12.5px;font-weight:700;color:var(--rc)}
.ws::after{content:'';position:absolute;inset-inline:0;bottom:0;height:3px;background:var(--rc)}
.ws.now{border-color:var(--or);background:linear-gradient(180deg,#ff7a1a22,var(--card));transform:translateY(-3px);box-shadow:0 8px 20px #0006}
.r-film{--rc:#ff7a1a}.r-edit{--rc:#2f8cff}.r-pub{--rc:#20c997}.r-rest{--rc:#8a7cff}.r-done{--rc:#20c997}
/* idea card */
.idea{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:20px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.idea::before{content:'';position:absolute;inset-inline:0;top:0;height:4px;background:var(--cc)}
.idea.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);margin-bottom:18px;box-shadow:0 20px 50px #0007;border-color:#ff7a1a55}
.idea.hero .ib{order:1}.heroart{order:2;width:100%;height:100%;min-height:240px;background:radial-gradient(circle at 75% 35%,#5fd4ff26,transparent 55%),linear-gradient(180deg,#0c2050,#081230)}
.ib{padding:22px;display:flex;flex-direction:column;gap:10px}
.idea h3{font-size:clamp(20px,2.4vw,26px)}
.itags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:20px;background:color-mix(in srgb,var(--tc,#ff7a1a) 18%,transparent);color:color-mix(in srgb,var(--tc,#ff7a1a) 70%,#fff)}
.tag.g{--tc:#93a3c7}.tag.ai{--tc:#7b5cff}.tag.d{--tc:#ff9a3c}
.yt{display:flex;gap:8px;align-items:flex-start;margin:0;background:#00000030;border-radius:12px;padding:10px 12px;font-size:15px}.yt .i{color:#ff3b3b;margin-top:2px}
.idesc{margin:0;color:#cdd7f0}
details summary{cursor:pointer;font-weight:700;color:var(--or2);list-style:none;display:flex;align-items:center;gap:6px;min-height:36px}
details summary::before{content:'+';display:grid;place-items:center;width:22px;height:22px;border-radius:6px;background:#ff7a1a22}details[open] summary::before{content:'−'}
details ol{margin:6px 0 0;padding-inline-start:22px;color:#cdd7f0}details li{margin:4px 0}
.iact{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.car{animation:drive 3.4s ease-in-out infinite}.ball{animation:bob 3.4s ease-in-out infinite}.boost{animation:flick .25s steps(2) infinite}.spark{animation:spark 3.4s infinite}
@keyframes drive{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px) rotate(8deg)}}@keyframes flick{50%{opacity:.6}}@keyframes spark{0%,40%,100%{opacity:0}50%,60%{opacity:1}}
/* cards */
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card h2{font-size:17px;display:flex;align-items:center;gap:8px}.card h2 .i{color:var(--or)}
.muted{color:var(--mute);margin:0}.pad{padding:14px 0}.center{text-align:center}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px;color:var(--mute)}.empty>.i{width:34px;height:34px;color:#3a5191}.empty p{margin:0}.empty.big{padding:40px;background:var(--card);border:1px dashed var(--line);border-radius:18px}
.nvid{display:flex;gap:12px;align-items:center;text-align:start;background:#ffffff06;border:1px solid var(--line);border-radius:14px;padding:10px;width:100%;transition:.2s}.nvid:hover{border-color:var(--or)}
.nvid b{display:block;line-height:1.35}.nvid small{display:block;color:var(--mute);font-size:13px}
.ring{width:56px;height:56px;flex:none}.ring text{fill:var(--ink);font:700 12px 'IBM Plex Sans Arabic'}
.st{color:var(--sc);font-weight:700}
.rest b{color:#a99cff;font-size:18px}.rest p{color:var(--mute);margin:4px 0 10px}
.warn{display:flex;align-items:center;gap:8px;background:#ff4d6d1a;border:1px solid #ff4d6d55;color:#ffb3c1;border-radius:10px;padding:8px 12px;font-weight:700}
.pub b{font-family:Alexandria;font-size:22px;display:block}.pub small{color:var(--mute)}
.count{display:flex;gap:8px;margin:12px 0 8px}.count span{flex:1;background:#00000030;border-radius:12px;padding:8px;text-align:center;font-size:12.5px;color:var(--mute)}.count b{display:block;font-family:Alexandria;font-size:26px;color:var(--or);line-height:1.1}.count .now{color:var(--ok);font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center}
.kpi .i{grid-row:span 2;width:40px;height:40px;padding:9px;border-radius:12px;background:#ff7a1a1f;color:var(--or)}
.kpi b{font-family:Alexandria;font-size:26px;line-height:1.1}.kpi span{color:var(--mute);font-size:13.5px}
/* tasks */
.tl{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#ffffff05;border:1px solid transparent;transition:.2s}
.task:hover{border-color:var(--line)}
.task span{flex:1;line-height:1.4}.task span small{display:block;color:var(--mute);font-size:12.5px}
.task em{font-style:normal;font-size:12.5px;color:var(--mute);white-space:nowrap}
.task.late em{color:#ff8aa0}.task.late{border-color:#ff4d6d40}
.cb{width:30px;height:30px;border-radius:9px;border:2px solid #3a5191;background:none;display:grid;place-items:center;flex:none;transition:.2s}
.cb .i{width:16px;height:16px;opacity:0;transform:scale(.4);transition:.2s;stroke-width:3}
.task.done .cb{background:var(--ok);border-color:var(--ok);color:#03241a}.task.done .cb .i{opacity:1;transform:none}
.task.done span{text-decoration:line-through;color:var(--mute)}
.tl.big .task{padding:12px}
.tl.mini .task{padding:6px;font-size:14px}.tl.mini .task em{display:none}.tl.mini .task.late{background:#ff4d6d12}.tl.mini .cb{width:26px;height:26px}
.addt{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.addt input{flex:1 1 200px}
input,select,textarea{background:#060c1c;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;font-size:16px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 3px #ff7a1a33}
textarea{resize:vertical;line-height:1.6}.mono{font-family:monospace;font-size:13px;direction:ltr}
/* chips / tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:#ffffff06;border-radius:30px;padding:6px 16px;min-height:40px;font-weight:600}
.chip.on{background:color-mix(in srgb,var(--tc) 22%,transparent);border-color:var(--tc);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{flex:none;border:1px solid var(--line);background:#ffffff06;border-radius:12px;padding:8px 14px;min-height:42px;font-weight:700;display:flex;gap:8px;align-items:center}
.tabs button.on{background:var(--or);color:#1d0c00;border-color:transparent}.tabs b{background:#00000030;border-radius:10px;padding:0 7px;font-size:12px}
.seg{display:flex;background:#ffffff08;border:1px solid var(--line);border-radius:12px;padding:3px}.seg button{border:0;background:none;padding:0 14px;min-height:38px;border-radius:9px;font-weight:700;color:var(--mute)}.seg button.on{background:var(--bl);color:#fff}
/* ideas */
.sec{font-size:19px;margin:22px 0 12px;display:flex;gap:8px;align-items:center}.sec small{color:var(--mute);font-size:14px}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:14px}
.igrid .idea{animation:pop .4s both}.igrid .idea:nth-child(2){animation-delay:.08s}.igrid .idea:nth-child(3){animation-delay:.16s}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.98)}}
.cta{display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,#ff7a1a1a,transparent);border:1px dashed #ff7a1a66;border-radius:16px;padding:18px}.cta>.i{width:36px;height:36px;color:var(--or)}.cta p{margin:2px 0 0;color:var(--mute)}
.slist{display:grid;gap:8px}
.srow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.srow .dot{width:10px;height:10px;border-radius:50%;background:var(--cc);flex:none}.srow>div:nth-child(2){flex:1}.srow b{display:block}.srow small{color:var(--mute)}.srow.used{opacity:.6}
.sa{display:flex;gap:6px;align-items:center}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:start}
.col{background:#0b1530aa;border:1px solid var(--line);border-radius:18px;padding:10px;min-height:300px;transition:.2s}
.col.over{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 10%,#0b1530)}
.col h2{font-size:15px;display:flex;align-items:center;gap:8px;padding:4px 6px 10px}.col h2 i{width:10px;height:10px;border-radius:50%;background:var(--sc)}.col h2 small{margin-inline-start:auto;color:var(--mute);background:#ffffff0c;border-radius:10px;padding:0 8px}
.cards{display:grid;gap:10px}.cempty{color:var(--mute);text-align:center;font-size:14px;padding:20px 0;margin:0}
.vc{background:var(--card2);border:1px solid var(--line);border-radius:14px;overflow:hidden;transition:.2s;border-top:3px solid var(--cc)}.vc:hover{transform:translateY(-2px);box-shadow:0 10px 24px #0007}
.vc.dragging{opacity:.4}
.vcb{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:start;border:0;background:none;padding:12px;width:100%}
.vcb b{line-height:1.35}.vcb small{color:var(--mute);font-size:12.5px}
.bar{display:block;width:100%;height:6px;background:#ffffff12;border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--or),var(--or2));border-radius:6px;transition:width .5s}
.vmv{display:flex;justify-content:space-between;padding:0 8px 8px}.vmv .ibtn{width:34px;height:34px}
/* calendar */
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.calnav b{font-family:Alexandria;font-size:18px;min-width:180px;text-align:center}
.wkvid{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px}.wkvid .nvid{flex:1 1 260px}.wkvid p{margin:0;flex:1;color:var(--mute)}.wkvid select{width:auto;flex:1 1 200px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;min-height:200px;display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--rc)}
.day.now{box-shadow:0 0 0 2px var(--or)}
.dh small{color:var(--mute);font-size:12px;display:block}.dh b{display:block;font-family:Alexandria}.dh span{color:var(--rc);font-weight:700;font-size:13.5px}
.day .muted{font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;color:var(--mute);font-size:14px}.legend span{display:flex;align-items:center;gap:6px}.legend span::before{content:'';width:12px;height:12px;border-radius:4px;background:var(--rc)}
.month{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px}
.mh,.mg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.mh span{text-align:center;color:var(--mute);font-size:13px;padding:4px 0}
.mc{min-height:92px;border-radius:10px;background:#ffffff05;padding:6px;display:flex;flex-direction:column;gap:3px}.mc.out{opacity:.35}.mc.now{box-shadow:inset 0 0 0 2px var(--or)}
.mc b{font-size:13px}
.ev{border:0;border-radius:6px;font-size:11.5px;font-weight:700;padding:2px 6px;text-align:start;background:color-mix(in srgb,var(--rc) 25%,transparent);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-inline-start:3px solid var(--rc)}
/* tasks view */
.vprog{display:flex;align-items:center;gap:12px}
.vgroup{border-bottom:1px solid var(--line);padding:8px 0}.vgroup summary{color:var(--ink);gap:12px}.vgroup summary::before{display:none}.vgroup summary b{flex:1}.vgroup .ring{width:44px;height:44px}
/* fans */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:12px}
.sug{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.sug.s-done{opacity:.65}
.votes{display:flex;flex-direction:column;align-items:center;gap:2px;flex:none}.votes b{font-family:Alexandria;font-size:22px;color:var(--or)}.votes small{color:var(--mute);font-size:12px}
.sb{flex:1;display:flex;flex-direction:column;gap:6px}.sb h3{font-size:18px}.sb p{margin:0;color:#cdd7f0}.sb .iact{margin-top:6px}
.lnk{color:var(--bl);direction:ltr;text-align:start;word-break:break-all}
/* stats */
.bars{display:flex;align-items:flex-end;gap:10px;height:200px;padding-top:20px}
.bc{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%}
.bv{flex:1;width:100%;max-width:46px;display:flex;align-items:flex-end;position:relative}
.bv::before{content:'';width:100%;height:max(var(--h),3%);background:linear-gradient(180deg,var(--or2),var(--or));border-radius:8px 8px 3px 3px;animation:grow .7s ease both}
@keyframes grow{from{height:0}}
.bv em{position:absolute;bottom:calc(max(var(--h),3%) + 4px);inset-inline:0;text-align:center;font-style:normal;font-weight:700;font-size:13px}
.bc small{color:var(--mute);font-size:12.5px}
.gauge{--p:0;width:170px;aspect-ratio:1;margin:8px auto;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#ffffff12 0);display:grid;place-items:center;position:relative}
.gauge::before{content:'';position:absolute;inset:16px;border-radius:50%;background:var(--card)}.gauge b{position:relative;font-family:Alexandria;font-size:34px}
.hrow{display:grid;grid-template-columns:110px minmax(0,1fr) 36px;gap:10px;align-items:center;font-size:14.5px}.hrow b{text-align:end}
.hb{height:10px;background:#ffffff10;border-radius:6px;overflow:hidden}.hb i{display:block;height:100%;background:var(--bl);border-radius:6px}
.minis{display:grid;gap:6px;margin-top:8px;border-top:1px solid var(--line);padding-top:10px}.minis span{display:flex;justify-content:space-between;color:var(--mute);font-size:14px}.minis b{color:var(--ink)}
/* settings / forms */
.set{margin-bottom:14px;max-width:760px}.set p{margin:0}
.form{display:grid;gap:12px}
label{display:grid;gap:6px;font-weight:600;font-size:14.5px;color:#cdd7f0}
.fg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}.mrow.start{justify-content:flex-start}.mrow .sp{flex:1}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;place-items:center;padding:16px;background:#02060fcc;backdrop-filter:blur(6px)}
#modal.open{display:grid;animation:fade .2s}@keyframes fade{from{opacity:0}}
.mbox{position:relative;width:min(560px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:linear-gradient(180deg,#122149,#0b1530);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 30px 80px #000;animation:mpop .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes mpop{from{transform:translateY(16px) scale(.97);opacity:0}}
.mbox.lg{width:min(780px,100%)}.mbox.sm{width:min(420px,100%)}.mbox.flat{padding:0;background:none;border:0;box-shadow:none}
.mbox h3{font-size:20px;margin-bottom:14px;padding-inline-end:44px}
.mx{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#00000030;display:grid;place-items:center;z-index:3}
.vd{display:grid;gap:14px}.vdh{display:flex;gap:14px;align-items:center;padding-inline-end:44px}.vdh>div{flex:1}
.tin{font-family:Alexandria;font-size:20px;font-weight:700;background:transparent;border-color:transparent;padding:6px 8px}.tin:hover{border-color:var(--line)}
.vmeta{display:flex;gap:10px;align-items:center;padding:0 8px;font-size:14px}.vmeta small{color:var(--mute)}
.vd h3{margin:4px 0 0;font-size:17px}.vd h3 small{color:var(--mute);font-weight:400}
.full{display:grid}
.moregrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.moregrid button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;border-radius:14px;border:1px solid var(--line);background:#ffffff06;font-weight:700}.moregrid .i{width:28px;height:28px;color:var(--or)}
.aiload{text-align:center;padding:20px}.aiload .i{width:44px;height:44px;color:#9a7bff}.spin{animation:spin 1.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
/* toasts & confetti */
#toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;display:grid;gap:8px;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:#13254d;border:1px solid var(--line);border-inline-start:4px solid var(--or);border-radius:12px;padding:10px 16px;font-weight:600;box-shadow:0 10px 30px #000a;animation:tin .3s cubic-bezier(.2,1.3,.4,1)}.toast.bad{border-inline-start-color:var(--bad)}
.toast.out{opacity:0;transform:translateY(10px);transition:.4s}@keyframes tin{from{opacity:0;transform:translateY(14px)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}.confetti i{position:absolute;top:-20px;left:var(--x);width:9px;height:14px;background:var(--c);border-radius:2px;animation:fall 1.8s var(--d) ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* bottom nav */
.bnav{display:none}

  openModal(`<button class="mx" data-a="close" aria-label="إغلاق">${ic('x')}</button><h3>${id ? 'تعديل الاقتراح' : 'اقتراح جديد من متابع'}</h3>
<form data-f="sug" data-id="${id || ''}" class="form"><label>اللعبة *<input id="sg" required value="${esc(s.game)}" list="sgames" placeholder="Prop Hunt، روبلوكس…"></label><label>الماب أو الفكرة<input id="sm" value="${esc(s.map)}" placeholder="مثال: ماب الهروب من السجن"></label>
<div class="fg2"><label>اسم المتابع<input id="sb" value="${esc(s.by)}"></label><label>المصدر<select id="sp">${['تعليقات يوتيوب', 'البث المباشر', 'تويتر/إكس', 'تيك توك', 'ديسكورد', 'انستغرام'].map(p => `<option ${s.platform === p ? 'selected' : ''}>${p}</option>`).join('')}</select></label></div>
<label>رابط أو كود الماب<input id="sl" value="${esc(s.link)}" dir="ltr"></label><label>ملاحظات<textarea id="sn" rows="3">${esc(s.note)}</textarea></label>
<div class="mrow"><button type="button" class="btn ghost" data-a="close">إلغاء</button><button class="btn pri">${id ? 'حفظ' : 'إضافة'}</button></div></form>
<datalist id="sgames"><option>Prop Hunt</option><option>روبلوكس</option><option>Fall Guys</option><option>ماينكرافت</option><option>Among Us</option><option>Rocket League</option><option>فورتنايت</option></datalist>`);
}

/* ---------- STATS ---------- */
function vStats() {
  const pub = S.videos.filter(v => v.status === 'published'), c = commitment();
  const executed = S.videos.filter(v => (v.ideaKey || v.fromSug) && v.status === 'published').length;
  const ideasUsed = S.saved.filter(i => i.used).length + S.suggestions.filter(s => s.status !== 'new').length;
  const allT = S.videos.flatMap(v => v.tasks), doneT = allT.filter(t => t.done).length;
  const months = []; const t0 = today(); for (let k = 5; k >= 0; k--) { const d = new Date(t0.getFullYear(), t0.getMonth() - k, 1); const key = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; months.push({ n: MON[d.getMonth()], v: pub.filter(x => (x.publishedAt || '').startsWith(key)).length }); }
  const mx = Math.max(1, ...months.map(m => m.v));
  let streak = 0; { let w = wkStart(today()); const pubWeeks = new Set(pub.map(v => ymd(wkStart(parse(v.publishedAt))))); if (!pubWeeks.has(ymd(w))) w = addDays(w, -7); while (pubWeeks.has(ymd(w))) { streak++; w = addDays(w, -7); } }
  const games = {}; S.videos.forEach(v => games[v.game] = (games[v.game] || 0) + 1); const gl = Object.entries(games).sort((a, b) => b[1] - a[1]).slice(0, 5); const gm = Math.max(1, ...gl.map(g => g[1]));
  return head('الإحصائيات', 'تابع إنتاجك والتزامك بالجدول') + `
<section class="kpis">${kpi('فيديو منشور', pub.length, 'yt')}${kpi('أفكار نُفذت', ideasUsed, 'bulb')}${kpi('معدل الالتزام بالجدول', c.rate == null ? '—' : c.rate + '%', 'check')}${kpi('أسابيع نشر متتالية', streak, 'rocket')}</section>
<section class="grid2">
<article class="card"><h2>${ic('chart')}الفيديوهات المنشورة شهرياً</h2><div class="bars">${months.map(m => `<div class="bc"><span class="bv" style="--h:${m.v / mx * 100}%"><em>${m.v}</em></span><small>${m.n}</small></div>`).join('')}</div></article>
<article class="card"><h2>${ic('check')}الالتزام بالجدول</h2>${c.total ? `<div class="gauge" style="--p:${c.rate}"><b>${c.rate}%</b></div><p class="muted center">${c.onTime} مهمة في موعدها من أصل ${c.total} مهمة حان وقتها</p>` : '<p class="muted pad">يظهر هنا بعد جدولة فيديو وإنجاز أولى مهامه.</p>'}</article>
<article class="card"><h2>${ic('film')}الفيديوهات حسب المرحلة</h2>${Object.entries(STAT).map(([k, s]) => { const n = S.videos.filter(v => v.status === k).length; return `<div class="hrow"><span>${s.n}</span><span class="hb"><i style="width:${S.videos.length ? n / S.videos.length * 100 : 0}%;background:${s.c}"></i></span><b>${n}</b></div>`; }).join('')}</article>
<article class="card"><h2>${ic('rocket')}أكثر الألعاب في قناتك</h2>${gl.length ? gl.map(([g, n]) => `<div class="hrow"><span>${esc(g)}</span><span class="hb"><i style="width:${n / gm * 100}%"></i></span><b>${n}</b></div>`).join('') : '<p class="muted pad">لا توجد فيديوهات بعد.</p>'}
<div class="minis"><span>مهام منجزة <b>${doneT}/${allT.length}</b></span><span>فيديوهات من أفكار التطبيق والمتابعين <b>${executed}</b></span><span>أفكار ظهرت لك <b>${S.seen.length}</b></span></div></article>
</section>`;
}

/* ---------- SETTINGS ---------- */
function vSettings() {
  return head('الإعدادات', 'خصّص التطبيق لقناتك') + `<section class="card set"><form data-f="settings" class="form">
<label>اسم القناة<input id="schan" value="${esc(S.settings.channel)}"></label>
<div class="fg2"><label>أول يوم في أسبوع الإنتاج (يوم التصوير)<select id="swk">${DAYN.map((d, k) => `<option value="${k}" ${S.settings.weekStart === k ? 'selected' : ''}>${d}</option>`).join('')}</select></label>
<label>وقت النشر المعتاد<input id="stime" type="time" value="${esc(S.settings.publishTime)}"></label></div>
<p class="muted">مع ${DAYN[S.settings.weekStart]} كبداية: النشر يكون يوم ${DAYN[(S.settings.weekStart + 4) % 7]}، والراحة يومي ${DAYN[(S.settings.weekStart + 5) % 7]} و${DAYN[(S.settings.weekStart + 6) % 7]}.</p>
<div class="mrow"><button class="btn pri">حفظ الإعدادات</button></div></form></section>
<section class="card set"><h2>${ic('save')}الحفظ والنسخ الاحتياطي</h2><p>${syncHTML()}</p><p class="muted">بياناتك تُحفظ تلقائياً. إذا فتحت التطبيق وأنت مسجّل في حسابك فهي تتزامن بين الجوال والكمبيوتر.</p>
<div class="mrow start"><button class="btn ghost" data-a="export">${ic('copy')}انسخ نسخة احتياطية</button><button class="btn ghost" data-a="import">استرجاع نسخة</button><button class="btn danger ghost" data-a="resetask">${ic('trash')}مسح كل البيانات</button></div></section>
<section class="card set"><h2>${ic('bulb')}بنك الأفكار</h2><p class="muted">ظهرت لك ${S.seen.length} فكرة من أصل ${IDEAS.length} في المولّد المدمج. الأفكار لا تتكرر حتى تنتهي كل أفكار القسم.</p><button class="btn ghost" data-a="resetseenask">إعادة ضبط سجل الأفكار</button></section>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  if (e.target === modal) return closeModal();
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, id = el.dataset.id;
  if (el.tagName === 'A') e.preventDefault();
  const H = {
    go: () => { closeModal(); ui.view = id; ui.keepScroll = false; history.replaceState(null, '', '#' + id); render(); window.scrollTo(0, 0); },
    more: () => openModal(`<h3>المزيد</h3><div class="moregrid">${['ideas', 'fans', 'stats', 'settings'].map(k => `<button data-a="go" data-id="${k}">${ic(VIEWS[k][1])}<span>${VIEWS[k][0]}</span></button>`).join('')}</div>`, 'sm sheet'),
    close: closeModal,
    newdaily: newDaily, saveidea: () => saveIdea(id), idea2video: () => { closeModal(); ideaToVideo(id); },
    aiidea: () => aiIdea(id),
    gen: () => genIdeas(id), ideacat: () => { ui.ideaCat = id; ui.gen = []; render(); },
    dismiss: () => { ui.gen = ui.gen.filter(i => i.key !== id); render(); },
    viewidea: () => { const i = findIdea(id); openModal(`<button class="mx" data-a="close" aria-label="إغلاق">${ic('x')}</button>${ideaCard(i)}`, 'lg flat'); },
    delidea: () => { S.saved = S.saved.filter(i => i.key !== id); save(); toast('حُذفت الفكرة'); },
    addidea: () => openModal(`<button class="mx" data-a="close" aria-label="إغلاق">${ic('x')}</button><h3>أضف فكرتك الخاصة</h3><form class="form" data-f="myidea"><label>الفكرة *<input id="mit" required placeholder="مثال: تحدي أهداف بالكرة العملاقة"></label><label>عنوان يوتيوب المقترح<input id="miy"></label><div class="fg2"><label>التصنيف<select id="mic">${Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.n}</option>`).join('')}</select></label><label>اللعبة<input id="mig" value="Rocket League"></label></div><label>الشرح<textarea id="mid" rows="3"></textarea></label><div class="mrow"><button type="button" class="btn ghost" data-a="close">إلغاء</button><button class="btn pri">حفظ الفكرة</button></div></form>`),
    addvideo: () => { const v = newVideo({}); save(true); openVideo(v.id); render(); },
    openvideo: () => openVideo(id), savevideo: () => saveVideoForm(id),
    delvideo: () => confirmBox('حذف هذا الفيديو نهائياً؟', 'delvideook', id, 'حذف'),
    delvideook: () => { S.videos = S.videos.filter(v => v.id !== id); S.suggestions.forEach(s => { if (s.videoId === id) { s.videoId = null; s.status = 'new'; } }); closeModal(); save(); toast('حُذف الفيديو'); },
    toggletask: () => { toggleTask(el.dataset.v, id); if (modal.classList.contains('open') && $('#vt')) { const keep = { t: $('#vt').value, g: $('#vg').value, d: $('#vdsc').value }; openVideo(el.dataset.v); $('#vt').value = keep.t; $('#vg').value = keep.g; $('#vdsc').value = keep.d; } },
    move: () => { setStatus(id, el.dataset.st); toast('نُقل إلى: ' + STAT[el.dataset.st].n); },
    schedule: () => scheduleVideo(id, el.dataset.wk), autosched: autoSchedule,
    unsched: () => { vid(id).week = null; save(); },
    assignwk: () => { const s = $('#pickv'); if (s) scheduleVideo(s.value, ui.calWeek); },
    calmode: () => { ui.calMode = id; render(); },
    wk: () => { ui.calWeek = +id === 0 ? ymd(wkStart(today())) : ymd(addDays(parse(ui.calWeek), 7 * +id)); render(); },
    mon: () => { if (+id === 0) { const d = today(); ui.calMonth = [d.getFullYear(), d.getMonth()]; } else { const d = new Date(ui.calMonth[0], ui.calMonth[1] + +id, 1); ui.calMonth = [d.getFullYear(), d.getMonth()]; } render(); },
    tasktab: () => { ui.taskTab = id; render(); },
    toggletodo: () => { const t = S.todos.find(x => x.id === id); t.done = !t.done; t.doneAt = t.done ? ymd(today()) : null; save(); },
    deltodo: () => { S.todos = S.todos.filter(x => x.id !== id); save(); },
    addsug: () => sugForm(), editsug: () => sugForm(id),
    delsug: () => confirmBox('حذف هذا الاقتراح؟', 'delsugok', id, 'حذف'),
    delsugok: () => { S.suggestions = S.suggestions.filter(s => s.id !== id); closeModal(); save(); },
    vote: () => { const s = S.suggestions.find(x => x.id === id); s.votes++; save(); },
    sugf: () => { ui.sugFilter = id; render(); },
    sug2video: () => { const s = S.suggestions.find(x => x.id === id); const v = newVideo({ title: `${s.game}${s.map ? ': ' + s.map : ''} (اقتراح ${s.by || 'المتابعين'})`, game: s.game, cat: s.game === 'Rocket League' ? 'modes' : 'other', desc: `اقتراح من المتابع ${s.by || ''} عبر ${s.platform || ''}.\n${s.note || ''}\n${s.link ? 'الرابط/الكود: ' + s.link : ''}\n\nلا تنسَ تذكر اسم المتابع في الفيديو!`, fromSug: s.id }); s.status = 'planned'; s.videoId = v.id; save(); toast('تحوّل الاقتراح إلى فيديو قادم'); openVideo(v.id); },
    export: async () => { const txt = JSON.stringify(S); try { await navigator.clipboard.writeText(txt); toast('نُسخت النسخة الاحتياطية، الصقها في ملاحظاتك'); } catch (err) { openModal(`<button class="mx" data-a="close" aria-label="إغلاق">${ic('x')}</button><h3>انسخ هذا النص واحفظه</h3><textarea rows="8" readonly class="mono">${esc(txt)}</textarea>`); } },
    import: () => openModal(`<button class="mx" data-a="close" aria-label="إغلاق">${ic('x')}</button><h3>استرجاع نسخة احتياطية</h3><form class="form" data-f="import"><label>الصق النسخة هنا<textarea id="imp" rows="8" class="mono" required></textarea></label><p class="muted">سيستبدل هذا كل بياناتك الحالية.</p><div class="mrow"><button type="button" class="btn ghost" data-a="close">إلغاء</button><button class="btn pri">استرجاع</button></div></form>`),
    resetask: () => confirmBox('مسح كل البيانات؟ لا يمكن التراجع.', 'resetok', '', 'امسح'),
    resetok: () => { const keep = S.settings; S = fresh(); S.settings = keep; closeModal(); save(); toast('تم مسح البيانات'); },
    resetseenask: () => confirmBox('إعادة ضبط سجل الأفكار؟ قد تظهر لك أفكار سابقة مرة أخرى.', 'resetseen', '', 'إعادة ضبط'),
    resetseen: () => { S.seen = []; closeModal(); save(); toast('أُعيد ضبط السجل'); }
  };
  if (H[a]) H[a]();
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-f]'); if (!f) return; e.preventDefault();
  const k = f.dataset.f, id = f.dataset.id;
  if (k === 'addtask') { const t = $('#nt').value.trim(); if (!t) return; const v = vid(id); v.tasks.splice(v.tasks.length - 1, 0, { id: uid(), t, o: null, pub: false, done: false, doneAt: null }); save(); const keep = { t: $('#vt').value, g: $('#vg').value, d: $('#vdsc').value }; openVideo(id); $('#vt').value = keep.t; $('#vg').value = keep.g; $('#vdsc').value = keep.d; $('#nt').focus(); }
  if (k === 'addtodo') { const t = $('#ntodo').value.trim(); if (!t) return; S.todos.push({ id: uid(), t, date: $('#ntodod').value, done: false }); save(); setTimeout(() => $('#ntodo') && $('#ntodo').focus(), 0); }
  if (k === 'sug') { const o = { game: $('#sg').value.trim(), map: $('#sm').value.trim(), by: $('#sb').value.trim(), platform: $('#sp').value, link: $('#sl').value.trim(), note: $('#sn').value.trim() }; if (!o.game) return; if (id) Object.assign(S.suggestions.find(s => s.id === id), o); else S.suggestions.push(Object.assign({ id: uid(), votes: 1, status: 'new', createdAt: ymd(today()), videoId: null }, o)); closeModal(); save(); toast(id ? 'تم التعديل' : 'أُضيف الاقتراح'); }
  if (k === 'myidea') { const t = $('#mit').value.trim(); if (!t) return; const i = { key: 'my:' + uid(), cat: $('#mic').value, title: t, yt: $('#miy').value.trim() || t, desc: $('#mid').value.trim(), steps: [], game: $('#mig').value.trim() || 'Rocket League', savedAt: ymd(today()), used: false }; S.saved.unshift(i); closeModal(); save(); toast('حُفظت فكرتك'); }
  if (k === 'settings') { S.settings.channel = $('#schan').value.trim() || 'قناتي'; S.settings.weekStart = +$('#swk').value; S.videos.forEach(v => { if (v.week) v.week = ymd(wkStart(parse(v.week))); }); S.settings.publishTime = $('#stime').value || '18:00'; ui.calWeek = ymd(wkStart(today())); save(); toast('حُفظت الإعدادات'); }
  if (k === 'import') { try { const v = JSON.parse($('#imp').value); if (!v || !v.v) throw 0; S = normalize(v); closeModal(); save(); toast('تم استرجاع بياناتك'); } catch (err) { toast('النص غير صالح', 'bad'); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('open')) closeModal(); });
/* drag & drop on kanban (desktop) */
document.addEventListener('dragstart', e => { const c = e.target.closest('[data-drag]'); if (c) { e.dataTransfer.setData('text/plain', c.dataset.drag); c.classList.add('dragging'); } });
document.addEventListener('dragend', e => { const c = e.target.closest('[data-drag]'); if (c) c.classList.remove('dragging'); document.querySelectorAll('.col.over').forEach(x => x.classList.remove('over')); });
document.addEventListener('dragover', e => { const c = e.target.closest('[data-drop]'); if (c) { e.preventDefault(); c.classList.add('over'); } });
document.addEventListener('dragleave', e => { const c = e.target.closest('[data-drop]'); if (c && !c.contains(e.relatedTarget)) c.classList.remove('over'); });
document.addEventListener('drop', e => { const c = e.target.closest('[data-drop]'); if (!c) return; e.preventDefault(); const id = e.dataTransfer.getData('text/plain'); if (id && vid(id) && vid(id).status !== c.dataset.drop) { setStatus(id, c.dataset.drop); toast('نُقل إلى: ' + STAT[c.dataset.drop].n); } });
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (VIEWS[v] && v !== ui.view) { ui.view = v; render(); } });
window.__rl = { get S() { return S; }, IDEAS };
ui.keepScroll = false; render();
}
</script><script>if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});</script></body></html>
